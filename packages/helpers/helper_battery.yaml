input_number:
  home_battery_usable_capacity_kwh:
    name: Home Battery Usable Capacity
    min: 1
    max: 100
    step: 0.1
    unit_of_measurement: kWh
    icon: mdi:battery-high
    mode: box

  home_battery_backup_reserve_percent:
    name: Home Battery Backup Reserve
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:battery-lock
    mode: slider
