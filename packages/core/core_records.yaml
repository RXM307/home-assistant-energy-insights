template:
  - trigger:
      - platform: time
        at: "00:00:00"
      - platform: state
        entity_id:
          - sensor.home_solar_power
          - sensor.home_load_power
          - sensor.home_load_no_ev_power
          - sensor.grid_net_power
          - sensor.home_battery_power
          - sensor.ev_charging_power
    sensor:
      - name: Peak Solar Power Daily
        unique_id: peak_solar_power_daily
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        state: >
          {% set current = states('sensor.home_solar_power') | float(0) %}
          {{ 0 if trigger.platform == 'time' else [this.state | float(0), current] | max }}

      - name: Peak Home Load Daily
        unique_id: peak_home_load_daily
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        state: >
          {% set current = states('sensor.home_load_power') | float(0) %}
          {{ 0 if trigger.platform == 'time' else [this.state | float(0), current] | max }}

      - name: Peak Home Load No EV Daily
        unique_id: peak_home_load_no_ev_daily
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        state: >
          {% set current = states('sensor.home_load_no_ev_power') | float(0) %}
          {{ 0 if trigger.platform == 'time' else [this.state | float(0), current] | max }}

      - name: Peak Grid Import Power Daily
        unique_id: peak_grid_import_power_daily
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        state: >
          {% set current = [states('sensor.grid_net_power') | float(0), 0] | max %}
          {{ 0 if trigger.platform == 'time' else [this.state | float(0), current] | max }}

      - name: Peak Grid Export Power Daily
        unique_id: peak_grid_export_power_daily
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        state: >
          {% set current = [0 - (states('sensor.grid_net_power') | float(0)), 0] | max %}
          {{ 0 if trigger.platform == 'time' else [this.state | float(0), current] | max }}

      - name: Peak Battery Charge Power Daily
        unique_id: peak_battery_charge_power_daily
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        state: >
          {% set current = [0 - (states('sensor.home_battery_power') | float(0)), 0] | max %}
          {{ 0 if trigger.platform == 'time' else [this.state | float(0), current] | max }}

      - name: Peak Battery Discharge Power Daily
        unique_id: peak_battery_discharge_power_daily
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        state: >
          {% set current = [states('sensor.home_battery_power') | float(0), 0] | max %}
          {{ 0 if trigger.platform == 'time' else [this.state | float(0), current] | max }}

      - name: Peak EV Charging Power Daily
        unique_id: peak_ev_charging_power_daily
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        state: >
          {% set current = states('sensor.ev_charging_power') | float(0) %}
          {{ 0 if trigger.platform == 'time' else [this.state | float(0), current] | max }}

  - trigger:
      - platform: time
        at: "00:00:05"
      - platform: state
        entity_id:
          - sensor.peak_solar_power_daily
          - sensor.peak_home_load_daily
          - sensor.peak_home_load_no_ev_daily
          - sensor.peak_grid_import_power_daily
          - sensor.peak_grid_export_power_daily
          - sensor.peak_battery_charge_power_daily
          - sensor.peak_battery_discharge_power_daily
          - sensor.peak_ev_charging_power_daily
    sensor:
      - name: Peak Solar Power Monthly
        unique_id: peak_solar_power_monthly
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        state: >
          {% set period = now().strftime('%Y-%m') %}
          {% set current = states('sensor.peak_solar_power_daily') | float(0) %}
          {% set previous = this.state | float(0) if this.attributes.get('record_period', '') == period else 0 %}
          {{ [previous, current] | max }}
        attributes:
          record_period: "{{ now().strftime('%Y-%m') }}"
          peak_date: >
            {% set period = now().strftime('%Y-%m') %}
            {% set current = states('sensor.peak_solar_power_daily') | float(0) %}
            {% set previous = this.state | float(0) if this.attributes.get('record_period', '') == period else 0 %}
