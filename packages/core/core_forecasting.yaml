      - name: Grid Export Yearly Projected
        unique_id: grid_export_yearly_projected
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        state: >
          {% set current = states('sensor.grid_export_total_yearly') %}
          {% set day = states('sensor.energy_year_day') | float(0) %}
          {% set y = now().year %}
          {% set days = 366 if ((y % 4 == 0 and y % 100 != 0) or (y % 400 == 0)) else 365 %}
          {{ (current | float(0) / day * days) | round(0) if current not in ['unknown', 'unavailable', 'none', 'None', ''] and day > 0 else 'unknown' }}

      - name: Grid Net Usage Yearly Projected
        unique_id: grid_net_usage_yearly_projected
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        state: >
          {% set imported = states('sensor.grid_import_yearly_projected') %}
          {% set exported = states('sensor.grid_export_yearly_projected') %}
          {% if imported in ['unknown', 'unavailable', 'none', 'None', ''] or exported in ['unknown', 'unavailable', 'none', 'None', ''] %}
            unknown
          {% else %}
            {{ ((imported | float(0)) - (exported | float(0))) | round(0) }}
          {% endif %}

      - name: EV Charging Yearly Projected
        unique_id: ev_charging_yearly_projected
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        state: >
          {% set current = states('sensor.ev_charging_yearly') %}
          {% set day = states('sensor.energy_year_day') | float(0) %}
          {% set y = now().year %}
          {% set days = 366 if ((y % 4 == 0 and y % 100 != 0) or (y % 400 == 0)) else 365 %}
          {{ (current | float(0) / day * days) | round(0) if current not in ['unknown', 'unavailable', 'none', 'None', ''] and day > 0 else 'unknown' }}

      - name: Solar Savings Yearly Projected
        unique_id: solar_savings_yearly_projected
        unit_of_measurement: "$"
        device_class: monetary
        state_class: total
        state: >
          {% set current = states('sensor.solar_savings_yearly') %}
          {% set day = states('sensor.energy_year_day') | float(0) %}
          {% set y = now().year %}
          {% set days = 366 if ((y % 4 == 0 and y % 100 != 0) or (y % 400 == 0)) else 365 %}
          {{ (current | float(0) / day * days) | round(2) if current not in ['unknown', 'unavailable', 'none', 'None', ''] and day > 0 else 'unknown' }}

      - name: Solar Savings Monthly Projected
        unique_id: solar_savings_monthly_projected
        unit_of_measurement: "$"
        device_class: monetary
        state_class: total
        state: >
          {% set projected = states('sensor.billing_solar_savings_projected') %}
          {{ projected if projected not in ['unknown', 'unavailable', 'none', 'None', ''] else 'unknown' }}

      - name: Solar Savings Projected Vs Average
        unique_id: solar_savings_projected_vs_average
        unit_of_measurement: "$"
        device_class: monetary
        state_class: total
        state: >
          {% set projected = states('sensor.solar_savings_monthly_projected') %}
          {% set average = states('sensor.solar_savings_average_monthly') | float(0) %}
          {% if projected in ['unknown', 'unavailable', 'none', 'None', ''] %}
            unknown
          {% else %}
            {{ ((projected | float(0)) - average) | round(2) }}
          {% endif %}

      - name: Solar Breakeven Months Remaining Current Pace
        unique_id: solar_breakeven_months_remaining_current_pace
        unit_of_measurement: mo
        icon: mdi:calendar-clock
        state: >
          {% set remaining = states('sensor.solar_breakeven_remaining') | float(0) %}
          {% set monthly = states('sensor.solar_savings_monthly_projected') | float(0) %}
          {{ (remaining / monthly) | round(1) if remaining > 0 and monthly > 0 else 'unknown' }}

      - name: Solar Breakeven Years Remaining Current Pace
        unique_id: solar_breakeven_years_remaining_current_pace
        unit_of_measurement: yr
        icon: mdi:calendar-range
        state: >
          {% set months = states('sensor.solar_breakeven_months_remaining_current_pace') | float(0) %}
          {{ (months / 12) | round(2) if months > 0 else 'unknown' }}

      - name: Solar Breakeven Date Current Pace
        unique_id: solar_breakeven_date_current_pace
        icon: mdi:calendar-check
        state: >
          {% set months = states('sensor.solar_breakeven_months_remaining_current_pace') | float(0) %}
          {{ (as_timestamp(now()) + (months * 30.4375 * 86400)) | timestamp_custom('%Y-%m-%d', true) if months > 0 else 'unknown' }}

      - name: Solar Forecast Adjusted Confidence
        unique_id: solar_forecast_adjusted_confidence
        icon: mdi:weather-partly-cloudy
        state: >
          {% set today_remaining = states('sensor.energy_production_today_remaining') %}
          {% set tomorrow = states('sensor.energy_production_tomorrow') %}
          {% set monthly = states('sensor.solar_generated_monthly') %}
          {% if monthly in ['unknown', 'unavailable', 'none', 'None', ''] %}
            Needs monthly solar data
          {% elif today_remaining in ['unknown', 'unavailable', 'none', 'None', ''] and tomorrow in ['unknown', 'unavailable', 'none', 'None', ''] %}
            Run rate only
          {% elif now().day <= 2 %}
            Low
          {% elif now().day <= 5 %}
            Medium
          {% else %}
            High
          {% endif %}

      - name: Solar Month End Forecast Method
        unique_id: solar_month_end_forecast_method
        icon: mdi:chart-bell-curve
        state: >
          {% set today_remaining = states('sensor.energy_production_today_remaining') %}
          {% set tomorrow = states('sensor.energy_production_tomorrow') %}
          {% if today_remaining in ['unknown', 'unavailable', 'none', 'None', ''] and tomorrow in ['unknown', 'unavailable', 'none', 'None', ''] %}
            Run rate
          {% else %}
            Forecast adjusted
          {% endif %}

      - name: Billing Forecast Summary
        unique_id: billing_forecast_summary
        icon: mdi:cash-clock
        state: >
          {% set status = states('sensor.billing_forecast_status') %}
          {% set projected = states('sensor.billing_cost_actual_projected') %}
          {% set remaining = states('sensor.billing_cost_remaining_projected') %}
          {% set days = states('sensor.energy_billing_cycle_days_remaining') | int(0) %}
          {% if projected in ['unknown', 'unavailable', 'none', 'None', ''] %}
            {{ status }}
          {% else %}
            Bill ${{ projected | float(0) | round(0) }}, ${{ remaining | float(0) | round(0) }} left, {{ days }}d
          {% endif %}

      - name: Solar Forecast Summary
        unique_id: solar_forecast_summary
        icon: mdi:solar-power
        state: >
          {% set adjusted = states('sensor.solar_generated_monthly_forecast_adjusted') %}
          {% set delta = states('sensor.solar_monthly_forecast_adjustment') %}
          {% set method = states('sensor.solar_month_end_forecast_method') %}
          {% if adjusted in ['unknown', 'unavailable', 'none', 'None', ''] %}
            Waiting for solar data
          {% else %}
            {{ adjusted | float(0) | round(0) }} kWh, {{ delta | float(0) | round(0) }} vs run rate, {{ method | lower }}
          {% endif %}

      - name: Energy Forecast Summary
        unique_id: energy_forecast_summary
        icon: mdi:crystal-ball
        state: >
          {% set billing = states('sensor.billing_forecast_status') %}
          {% set monthly = states('sensor.monthly_forecast_status') %}
          {% set solar = states('sensor.solar_forecast_adjusted_confidence') %}
          Billing {{ billing }}, month {{ monthly }}, solar {{ solar }}
