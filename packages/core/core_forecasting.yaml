automation:
  - alias: Initialize Energy Billing Cycle Start
    id: initialize_energy_billing_cycle_start
    description: Set the billing cycle start when it is missing or accidentally in the future.
    mode: single
    trigger:
      - platform: homeassistant
        event: start
    condition:
      - condition: template
        value_template: >
          {% set start = states('input_datetime.energy_billing_cycle_start') %}
          {{ start in ['unknown', 'unavailable', 'none', 'None', ''] or as_datetime(start).date() > now().date() }}
    action:
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.energy_billing_cycle_start
        data:
          date: "{{ now().date() }}"

  - alias: Auto Reset Energy Billing Cycle
    id: auto_reset_energy_billing_cycle
    description: Reset the energy billing cycle near the regular billing rollover.
    mode: single
    trigger:
      - platform: time
        at: "23:00:00"
    condition:
      - condition: template
        value_template: >
          {% set start = states('input_datetime.energy_billing_cycle_start') %}
          {% set length = states('input_number.energy_billing_cycle_length_days') | int(30) %}
          {% set tomorrow = now() + timedelta(days=1) %}
          {% if start in ['unknown', 'unavailable', 'none', 'None', ''] %}
            false
          {% else %}
            {% set next_start = as_datetime(start) + timedelta(days=length) %}
            {{ tomorrow.date() == next_start.date() }}
          {% endif %}
    action:
      - service: script.reset_billing_cycle

script:
  reset_billing_cycle:
    alias: Reset Billing Cycle
    description: Reset all billing-cycle energy meters and start a new forecast cycle.
    icon: mdi:lock-reset
    mode: single
    sequence:
      - service: system_log.write
        data:
          message: Billing cycle reset triggered
          level: warning
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.energy_billing_cycle_start
        data:
          date: >
            {% set start = states('input_datetime.energy_billing_cycle_start') %}
            {% set length = states('input_number.energy_billing_cycle_length_days') | int(30) %}
            {% set tomorrow = now() + timedelta(days=1) %}
            {% if start not in ['unknown', 'unavailable', 'none', 'None', ''] %}
              {% set next_start = as_datetime(start) + timedelta(days=length) %}
              {{ tomorrow.date() if tomorrow.date() == next_start.date() else now().date() }}
            {% else %}
              {{ now().date() }}
            {% endif %}
      - service: utility_meter.reset
        target:
          entity_id:
            - sensor.grid_import_billing
            - sensor.grid_export_total_billing
            - sensor.home_load_billing
            - sensor.home_load_no_ev_billing
            - sensor.ev_charging_billing
            - sensor.solar_generated_billing

template:
  - sensor:
      - name: Energy Billing Cycle Day
        unique_id: energy_billing_cycle_day
        unit_of_measurement: d
        icon: mdi:calendar-today
        state: >
          {% set start = states('input_datetime.energy_billing_cycle_start') %}
          {% set length = states('input_number.energy_billing_cycle_length_days') | int(30) %}
          {% if start in ['unknown', 'unavailable', 'none', 'None', ''] %}
            unknown
          {% elif as_datetime(start).date() > now().date() %}
            unknown
          {% else %}
            {% set elapsed = (((as_timestamp(now()) - as_timestamp(start)) / 86400) | int(0)) + 1 %}
            {{ [elapsed, 1] | max }}
          {% endif %}

      - name: Energy Billing Cycle Days Remaining
        unique_id: energy_billing_cycle_days_remaining
        unit_of_measurement: d
        icon: mdi:calendar-end
        state: >
          {% set day = states('sensor.energy_billing_cycle_day') | int(0) %}
          {% set length = states('input_number.energy_billing_cycle_length_days') | int(30) %}
          {{ [length - day, 0] | max if day > 0 else 'unknown' }}

      - name: Energy Billing Cycle Progress Percent
        unique_id: energy_billing_cycle_progress_percent
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:chart-donut
        state: >
          {% set day = states('sensor.energy_billing_cycle_day') | float(0) %}
          {% set length = states('input_number.energy_billing_cycle_length_days') | float(30) %}
          {{ (day / length * 100) | round(1) if day > 0 and length > 0 else 'unknown' }}

      - name: Energy Forecast Confidence
        unique_id: energy_forecast_confidence
        icon: mdi:shield-check
        state: >
          {% set start = states('input_datetime.energy_billing_cycle_start') %}
          {% set day = states('sensor.energy_billing_cycle_day') | int(0) %}
          {% set length = states('input_number.energy_billing_cycle_length_days') | int(30) %}
          {% if start in ['unknown', 'unavailable', 'none', 'None', ''] %}
            Needs setup
          {% elif as_datetime(start).date() > now().date() %}
            Needs valid start date
          {% elif day <= 1 %}
            Low
          {% elif day <= 4 %}
            Medium
          {% elif day > length %}
            Check reset
          {% else %}
            High
          {% endif %}

      - name: Billing Forecast Status
        unique_id: billing_forecast_status
        icon: mdi:cash-clock
        state: >
          {% set projected = states('sensor.billing_cost_actual_projected') %}
          {% set confidence = states('sensor.energy_forecast_confidence') %}
          {% if confidence == 'Needs setup' %}
            Needs billing start date
          {% elif projected in ['unknown', 'unavailable', 'none', 'None', ''] %}
            Waiting for more cycle data
          {% else %}
            {{ confidence }}
          {% endif %}

      - name: Monthly Forecast Status
        unique_id: monthly_forecast_status
        icon: mdi:calendar-clock
        state: >
          {% set day = now().day %}
          {% if day <= 1 %}
            Low
          {% elif day <= 4 %}
            Medium
          {% else %}
            High
          {% endif %}

      - name: Energy Month Day
        unique_id: energy_month_day
        unit_of_measurement: d
        icon: mdi:calendar-today
        state: "{{ now().day }}"

      - name: Energy Month Days Remaining
        unique_id: energy_month_days_remaining
        unit_of_measurement: d
        icon: mdi:calendar-end
        state: >
          {% set y = now().year %}
          {% set m = now().month %}
          {% set leap = (y % 4 == 0 and y % 100 != 0) or (y % 400 == 0) %}
          {% set days = [31, 29 if leap else 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1] %}
          {{ days - now().day }}

      - name: Energy Month Progress Percent
        unique_id: energy_month_progress_percent
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:chart-donut
        state: >
          {% set y = now().year %}
          {% set m = now().month %}
          {% set leap = (y % 4 == 0 and y % 100 != 0) or (y % 400 == 0) %}
          {% set days = [31, 29 if leap else 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1] %}
          {{ (now().day / days * 100) | round(1) }}

      - name: Energy Year Day
        unique_id: energy_year_day
        unit_of_measurement: d
        icon: mdi:calendar-today
        state: >
          {% set start = now().replace(month=1, day=1, hour=0, minute=0, second=0, microsecond=0) %}
          {{ (((as_timestamp(now()) - as_timestamp(start)) / 86400) | int(0)) + 1 }}

      - name: Energy Year Days Remaining
        unique_id: energy_year_days_remaining
        unit_of_measurement: d
        icon: mdi:calendar-end
        state: >
          {% set y = now().year %}
          {% set days = 366 if ((y % 4 == 0 and y % 100 != 0) or (y % 400 == 0)) else 365 %}
          {% set day = states('sensor.energy_year_day') | int(1) %}
          {{ [days - day, 0] | max }}

      - name: Energy Year Progress Percent
        unique_id: energy_year_progress_percent
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:chart-donut
        state: >
          {% set y = now().year %}
          {% set days = 366 if ((y % 4 == 0 and y % 100 != 0) or (y % 400 == 0)) else 365 %}
          {% set day = states('sensor.energy_year_day') | float(1) %}
          {{ (day / days * 100) | round(1) }}

      - name: Billing Cost Actual Projected
        unique_id: billing_cost_actual_projected
        unit_of_measurement: "$"
        device_class: monetary
        state_class: total
        state: >
          {% set current = states('sensor.billing_cost_actual_total') | float(0) %}
          {% set day = states('sensor.energy_billing_cycle_day') | float(0) %}
          {% set length = states('input_number.energy_billing_cycle_length_days') | float(30) %}
          {% set min_days = states('input_number.energy_forecast_min_elapsed_days') | float(2) %}
          {{ (current / day * length) | round(2) if day >= min_days and length > 0 else 'unknown' }}

      - name: Billing Cost Without Solar Projected
        unique_id: billing_cost_without_solar_projected
        unit_of_measurement: "$"
        device_class: monetary
        state_class: total
        state: >
          {% set current = states('sensor.billing_cost_without_solar_total') | float(0) %}
          {% set day = states('sensor.energy_billing_cycle_day') | float(0) %}
          {% set length = states('input_number.energy_billing_cycle_length_days') | float(30) %}
          {% set min_days = states('input_number.energy_forecast_min_elapsed_days') | float(2) %}
          {{ (current / day * length) | round(2) if day >= min_days and length > 0 else 'unknown' }}

      - name: Billing Solar Savings Projected
        unique_id: billing_solar_savings_projected
        unit_of_measurement: "$"
        device_class: monetary
        state_class: total
        state: >
          {% set current = states('sensor.billing_solar_savings_total') | float(0) %}
          {% set day = states('sensor.energy_billing_cycle_day') | float(0) %}
          {% set length = states('input_number.energy_billing_cycle_length_days') | float(30) %}
          {% set min_days = states('input_number.energy_forecast_min_elapsed_days') | float(2) %}
          {{ (current / day * length) | round(2) if day >= min_days and length > 0 else 'unknown' }}

      - name: Billing Cost Remaining Projected
        unique_id: billing_cost_remaining_projected
        unit_of_measurement: "$"
        device_class: monetary
        state_class: total
        state: >
          {% set projected = states('sensor.billing_cost_actual_projected') %}
          {% set current = states('sensor.billing_cost_actual_total') | float(0) %}
          {% if projected in ['unknown', 'unavailable', 'none', 'None', ''] %}
            unknown
          {% else %}
            {{ ([((projected | float(0)) - current), 0] | max) | round(2) }}
          {% endif %}

      - name: Billing Projected Vs Current Delta
        unique_id: billing_projected_vs_current_delta
        unit_of_measurement: "$"
        device_class: monetary
        state_class: total
        state: >
          {% set projected = states('sensor.billing_cost_actual_projected') %}
          {% set current = states('sensor.billing_cost_actual_total') | float(0) %}
          {% if projected in ['unknown', 'unavailable', 'none', 'None', ''] %}
            unknown
          {% else %}
            {{ ((projected | float(0)) - current) | round(2) }}
          {% endif %}

      - name: Billing Projected Daily Cost Remaining
        unique_id: billing_projected_daily_cost_remaining
        unit_of_measurement: "$/d"
        state_class: measurement
        icon: mdi:cash-clock
        state: >
          {% set remaining_cost = states('sensor.billing_cost_remaining_projected') %}
          {% set remaining_days = states('sensor.energy_billing_cycle_days_remaining') | float(0) %}
          {% if remaining_cost in ['unknown', 'unavailable', 'none', 'None', ''] or remaining_days <= 0 %}
            unknown
          {% else %}
            {{ (remaining_cost | float(0) / remaining_days) | round(2) }}
          {% endif %}

      - name: Billing Grid Import Projected
        unique_id: billing_grid_import_projected
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        state: >
          {% set current = states('sensor.grid_import_billing') | float(0) %}
          {% set day = states('sensor.energy_billing_cycle_day') | float(0) %}
          {% set length = states('input_number.energy_billing_cycle_length_days') | float(30) %}
          {% set min_days = states('input_number.energy_forecast_min_elapsed_days') | float(2) %}
          {{ (current / day * length) | round(1) if day >= min_days and length > 0 else 'unknown' }}

      - name: Billing Grid Export Projected
        unique_id: billing_grid_export_projected
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        state: >
          {% set current = states('sensor.grid_export_total_billing') | float(0) %}
          {% set day = states('sensor.energy_billing_cycle_day') | float(0) %}
          {% set length = states('input_number.energy_billing_cycle_length_days') | float(30) %}
          {% set min_days = states('input_number.energy_forecast_min_elapsed_days') | float(2) %}
          {{ (current / day * length) | round(1) if day >= min_days and length > 0 else 'unknown' }}

      - name: Billing Net Grid Projected
        unique_id: billing_net_grid_projected
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        state: >
          {% set current = states('sensor.grid_net_billing') | float(0) %}
          {% set day = states('sensor.energy_billing_cycle_day') | float(0) %}
          {% set length = states('input_number.energy_billing_cycle_length_days') | float(30) %}
          {% set min_days = states('input_number.energy_forecast_min_elapsed_days') | float(2) %}
          {{ (current / day * length) | round(1) if day >= min_days and length > 0 else 'unknown' }}

      - name: Solar Generated Monthly Projected
        unique_id: solar_generated_monthly_projected
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        state: >
          {% set current = states('sensor.solar_generated_monthly') | float(0) %}
          {% set day = now().day | float(1) %}
          {% set y = now().year %}
          {% set m = now().month %}
          {% set leap = (y % 4 == 0 and y % 100 != 0) or (y % 400 == 0) %}
          {% set days = [31, 29 if leap else 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1] %}
          {{ (current / day * days) | round(1) }}

      - name: Solar Generated Monthly Forecast Adjusted
        unique_id: solar_generated_monthly_forecast_adjusted
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        state: >
          {% set current = states('sensor.solar_generated_monthly') | float(0) %}
          {% set today_remaining = states('sensor.energy_production_today_remaining') | float(0) %}
          {% set tomorrow = states('sensor.energy_production_tomorrow') | float(0) %}
          {% set day = now().day | float(1) %}
          {% set y = now().year %}
          {% set m = now().month %}
          {% set leap = (y % 4 == 0 and y % 100 != 0) or (y % 400 == 0) %}
          {% set days = [31, 29 if leap else 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1] %}
          {% set avg_so_far = current / day %}
          {% set days_after_tomorrow = [days - now().day - 1, 0] | max %}
          {{ (current + today_remaining + tomorrow + (avg_so_far * days_after_tomorrow)) | round(1) }}

      - name: Solar Monthly Forecast Adjustment
        unique_id: solar_monthly_forecast_adjustment
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        state: >
          {% set adjusted = states('sensor.solar_generated_monthly_forecast_adjusted') %}
          {% set run_rate = states('sensor.solar_generated_monthly_projected') %}
          {% if adjusted in ['unknown', 'unavailable', 'none', 'None', ''] or run_rate in ['unknown', 'unavailable', 'none', 'None', ''] %}
            unknown
          {% else %}
            {{ ((adjusted | float(0)) - (run_rate | float(0))) | round(1) }}
          {% endif %}

      - name: Home Load No EV Monthly Projected
        unique_id: home_load_no_ev_monthly_projected
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        state: >
          {% set current = states('sensor.home_load_no_ev_monthly') | float(0) %}
          {% set day = now().day | float(1) %}
          {% set y = now().year %}
          {% set m = now().month %}
          {% set leap = (y % 4 == 0 and y % 100 != 0) or (y % 400 == 0) %}
          {% set days = [31, 29 if leap else 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1] %}
          {{ (current / day * days) | round(1) }}

      - name: Grid Import Monthly Projected
        unique_id: grid_import_monthly_projected
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        state: >
          {% set current = states('sensor.grid_import_monthly') | float(0) %}
          {% set day = now().day | float(1) %}
          {% set y = now().year %}
          {% set m = now().month %}
          {% set leap = (y % 4 == 0 and y % 100 != 0) or (y % 400 == 0) %}
          {% set days = [31, 29 if leap else 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1] %}
          {{ (current / day * days) | round(1) }}

      - name: Grid Export Monthly Projected
        unique_id: grid_export_monthly_projected
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        state: >
          {% set current = states('sensor.grid_export_total_monthly') | float(0) %}
          {% set day = now().day | float(1) %}
          {% set y = now().year %}
          {% set m = now().month %}
          {% set leap = (y % 4 == 0 and y % 100 != 0) or (y % 400 == 0) %}
          {% set days = [31, 29 if leap else 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1] %}
          {{ (current / day * days) | round(1) }}

      - name: Grid Net Usage Monthly Projected
        unique_id: grid_net_usage_monthly_projected
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        state: >
          {% set current = states('sensor.grid_net_usage_monthly') | float(0) %}
          {% set day = now().day | float(1) %}
          {% set y = now().year %}
          {% set m = now().month %}
          {% set leap = (y % 4 == 0 and y % 100 != 0) or (y % 400 == 0) %}
          {% set days = [31, 29 if leap else 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1] %}
          {{ (current / day * days) | round(1) }}

      - name: EV Charging Monthly Projected
        unique_id: ev_charging_monthly_projected
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        state: >
          {% set current = states('sensor.ev_charging_monthly') | float(0) %}
          {% set day = now().day | float(1) %}
          {% set y = now().year %}
          {% set m = now().month %}
          {% set leap = (y % 4 == 0 and y % 100 != 0) or (y % 400 == 0) %}
          {% set days = [31, 29 if leap else 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1] %}
          {{ (current / day * days) | round(1) }}

      - name: EV Home Charging Cost Monthly Projected
        unique_id: ev_home_charging_cost_monthly_projected
        unit_of_measurement: "$"
        device_class: monetary
        state_class: total
        state: >
          {% set current = states('sensor.ev_home_charging_cost_monthly') %}
          {% set day = now().day | float(1) %}
          {% set y = now().year %}
          {% set m = now().month %}
          {% set leap = (y % 4 == 0 and y % 100 != 0) or (y % 400 == 0) %}
          {% set days = [31, 29 if leap else 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1] %}
          {{ (current | float(0) / day * days) | round(2) if current not in ['unknown', 'unavailable', 'none', 'None', ''] else 'unknown' }}

      - name: EV Home Charging Gas Equivalent Monthly Projected
        unique_id: ev_home_charging_gas_equivalent_monthly_projected
        unit_of_measurement: "$"
        device_class: monetary
        state_class: total
        state: >
          {% set current = states('sensor.ev_home_charging_gas_equivalent_monthly') %}
          {% set day = now().day | float(1) %}
          {% set y = now().year %}
          {% set m = now().month %}
          {% set leap = (y % 4 == 0 and y % 100 != 0) or (y % 400 == 0) %}
          {% set days = [31, 29 if leap else 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1] %}
          {{ (current | float(0) / day * days) | round(2) if current not in ['unknown', 'unavailable', 'none', 'None', ''] else 'unknown' }}

      - name: EV Home Charging Savings Monthly Projected
        unique_id: ev_home_charging_savings_monthly_projected
        unit_of_measurement: "$"
        device_class: monetary
        state_class: total
        state: >
          {% set current = states('sensor.ev_home_charging_savings_monthly') %}
          {% set day = now().day | float(1) %}
          {% set y = now().year %}
          {% set m = now().month %}
          {% set leap = (y % 4 == 0 and y % 100 != 0) or (y % 400 == 0) %}
          {% set days = [31, 29 if leap else 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1] %}
          {{ (current | float(0) / day * days) | round(2) if current not in ['unknown', 'unavailable', 'none', 'None', ''] else 'unknown' }}

      - name: Solar Generated Yearly Projected
        unique_id: solar_generated_yearly_projected
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        state: >
          {% set current = states('sensor.solar_generated_yearly') %}
          {% set day = states('sensor.energy_year_day') | float(0) %}
          {% set y = now().year %}
          {% set days = 366 if ((y % 4 == 0 and y % 100 != 0) or (y % 400 == 0)) else 365 %}
          {{ (current | float(0) / day * days) | round(0) if current not in ['unknown', 'unavailable', 'none', 'None', ''] and day > 0 else 'unknown' }}

      - name: Home Load No EV Yearly Projected
        unique_id: home_load_no_ev_yearly_projected
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
