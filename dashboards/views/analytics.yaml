---
title: Analytics
path: analytics
icon: mdi:chart-box
type: sections
max_columns: 2
sections:
- type: grid
  column_span: 3
  cards:
  - type: custom:mushroom-title-card
    grid_options:
      columns: full
    title: Energy Analytics
    subtitle: Comparisons, mixes, and longer-range tracking
  - type: custom:apexcharts-card
    grid_options:
      columns: full
    section_mode: true
    header:
      show: true
      title: Recent Energy Totals, 7d
      show_states: true
    graph_span: 7d
    span:
      end: day
    apex_config:
      chart:
        height: 340px
      colors:
      - "#f9c74f"
      - "#f94144"
      - "#9b5de5"
      - "#277da1"
      legend:
        show: true
        position: top
        horizontalAlign: left
      grid:
        padding:
          bottom: 72
      xaxis:
        type: datetime
        tickAmount: 4
        labels:
          show: true
          rotate: 0
          minHeight: 56
          maxHeight: 80
          offsetY: 10
          datetimeUTC: false
          format: MMM d
          hideOverlappingLabels: false
          trim: false
          datetimeFormatter:
            day: MMM d
            month: MMM yyyy
    all_series_config:
      type: column
      float_precision: 2
    series:
    - entity: sensor.solar_generated_daily
      name: Solar
      color: "#f9c74f"
      group_by:
        func: max
        duration: 1d
    - entity: sensor.home_load_no_ev_daily
      name: Home No EV
      color: "#f94144"
      group_by:
        func: max
        duration: 1d
    - entity: sensor.ev_charging_daily
      name: EV
      color: "#9b5de5"
      group_by:
        func: max
        duration: 1d
    - entity: sensor.grid_import_daily
      name: Grid Import
      color: "#277da1"
      group_by:
        func: max
        duration: 1d
- type: grid
  column_span: 2
  cards:
  - type: custom:mushroom-title-card
    grid_options:
      columns: full
    title: Energy Mix
    subtitle: Raw source activity; import/export detail remains in Grid Balance
  - type: custom:mushroom-chips-card
    grid_options:
      columns: full
    alignment: justify
    chips:
    - type: template
      entity: sensor.energy_mix_solar_daily_percent
      tap_action:
        action: more-info
      icon: mdi:solar-power
      icon_color: amber
      content: Solar {{ states('sensor.energy_mix_solar_daily_percent') }}%
    - type: template
      entity: sensor.energy_mix_battery_daily_percent
      tap_action:
        action: more-info
      icon: mdi:battery
      icon_color: green
      content: Battery {{ states('sensor.energy_mix_battery_daily_percent') }}%
    - type: template
      entity: sensor.energy_mix_grid_daily_percent
      tap_action:
        action: more-info
      icon: mdi:transmission-tower
      icon_color: blue
      content: Grid {{ states('sensor.energy_mix_grid_daily_percent') }}%
  - type: custom:apexcharts-card
    grid_options:
      columns: full
    section_mode: true
    header:
      show: true
      title: Source Activity, 30d
      show_states: true
    graph_span: 30d
    span:
      end: day
    apex_config:
      chart:
        height: 340px
      colors:
      - "#f9c74f"
      - "#43aa8b"
      - "#277da1"
      legend:
        show: true
        position: top
        horizontalAlign: left
      grid:
        padding:
          bottom: 72
      xaxis:
        type: datetime
        tickAmount: 4
        labels:
          show: true
          rotate: -30
          minHeight: 56
          maxHeight: 80
          offsetY: 10
          hideOverlappingLabels: true
          trim: true
          datetimeUTC: false
          format: MMM d
          datetimeFormatter:
            day: MMM d
            month: MMM yyyy
    all_series_config:
      type: column
      float_precision: 2
    series:
    - entity: sensor.solar_generated_daily
      name: Solar Generated
      color: "#f9c74f"
      group_by:
        func: max
        duration: 1d
    - entity: sensor.battery_discharged_daily
      name: Battery Discharged
      color: "#4d908e"
      group_by:
        func: max
        duration: 1d
    - entity: sensor.grid_import_daily
      name: Grid Import
      color: "#277da1"
      group_by:
        func: max
        duration: 1d
- type: grid
  column_span: 2
  cards:
  - type: custom:mushroom-title-card
    grid_options:
      columns: full
    title: Grid Balance
    subtitle: Import, export, and net usage
  - type: custom:apexcharts-card
    grid_options:
      columns: full
    section_mode: true
    header:
      show: true
      title: Grid Import vs Export, 30d
      show_states: true
    graph_span: 30d
    span:
      end: day
    apex_config:
      chart:
        height: 320px
      colors:
      - "#277da1"
      - "#4d908e"
      - "#577590"
      legend:
        show: true
        position: top
        horizontalAlign: left
      grid:
        padding:
          bottom: 72
      xaxis:
        type: datetime
        tickAmount: 4
        labels:
          show: true
          rotate: -30
          minHeight: 56
          maxHeight: 80
          offsetY: 10
          datetimeUTC: false
          datetimeFormatter:
            day: MMM d
            month: MMM yyyy
    all_series_config:
      stroke_width: 3
      float_precision: 2
    series:
    - entity: sensor.grid_import_daily
      name: Import
      color: "#277da1"
      type: column
      group_by:
        func: max
        duration: 1d
    - entity: sensor.grid_export_total_daily
      name: Export
      color: "#4d908e"
      type: column
      group_by:
        func: max
        duration: 1d
    - entity: sensor.grid_net_usage_daily
      name: Net Grid
      color: "#577590"
      type: line
      group_by:
        func: max
        duration: 1d
- type: grid
  column_span: 2
  cards:
  - type: custom:mushroom-title-card
    grid_options:
      columns: full
    title: Net Credits
    subtitle: Daily change and configurable annual credit bank
  - type: custom:mushroom-chips-card
    grid_options:
      columns: full
    alignment: justify
    chips:
    - type: template
      entity: sensor.daily_net_export_credit
      tap_action:
        action: more-info
      icon: mdi:calendar-today
      icon_color: "{{ iif(states('sensor.daily_net_export_credit') | float(0) >= 0,
        'green', 'red') }}"
      content: Today {{ "%.1f" | format(states('sensor.daily_net_export_credit') |
        float(0)) }} kWh
    - type: template
      entity: sensor.annual_net_export_credit
      tap_action:
        action: more-info
      icon: mdi:calendar-sync
      icon_color: "{{ iif(states('sensor.annual_net_export_credit') | float(0) > 0,
        'green', 'grey') }}"
      content: Bank {{ "%.1f" | format(states('sensor.annual_net_export_credit') |
        float(0)) }} kWh
    - type: template
      entity: sensor.annual_net_export_credit_value
      tap_action:
        action: more-info
      icon: mdi:cash
      icon_color: green
      content: ${{ "%.2f" | format(states('sensor.annual_net_export_credit_value')
        | float(0)) }}
  - type: custom:apexcharts-card
    grid_options:
      columns: full
    section_mode: true
    header:
      show: true
      title: Credit Bank Trend, 30d
      show_states: true
    graph_span: 30d
    apex_config:
      chart:
        height: 320px
      colors:
      - "#90be6d"
      - "#43aa8b"
      legend:
        show: true
        position: top
        horizontalAlign: left
      grid:
        padding:
          bottom: 72
      xaxis:
        type: datetime
        tickAmount: 4
        labels:
          show: true
          rotate: -30
          minHeight: 56
          maxHeight: 80
          offsetY: 10
          datetimeUTC: false
          hideOverlappingLabels: true
          trim: true
          datetimeFormatter:
            day: MMM d
            month: MMM yyyy
    all_series_config:
      stroke_width: 3
      float_precision: 2
    series:
    - entity: sensor.daily_net_export_credit
      name: Daily Change
      color: "#4d908e"
      type: column
      group_by:
        func: max
        duration: 1d
    - entity: sensor.annual_net_export_credit
      name: Credit Bank
      color: "#4d908e"
      type: line
      group_by:
        func: last
        duration: 1d
  - type: custom:apexcharts-card
    grid_options:
      columns: full
    section_mode: true
    header:
      show: true
      title: Monthly Net Credits, 12 Months
      show_states: true
    graph_span: 365d
    apex_config:
      chart:
        height: 300px
      colors:
      - "#43aa8b"
      legend:
        show: true
        position: top
        horizontalAlign: left
      grid:
        padding:
          bottom: 72
      xaxis:
        type: datetime
        tickAmount: 6
        labels:
          show: true
          rotate: -30
          minHeight: 56
          maxHeight: 80
          offsetY: 10
          datetimeUTC: false
          hideOverlappingLabels: true
          trim: true
          datetimeFormatter:
            month: MMM yyyy
            year: yyyy
    all_series_config:
      stroke_width: 3
      float_precision: 2
    series:
    - entity: sensor.monthly_net_export_credit
      name: Monthly kWh
      color: "#4d908e"
      type: column
      group_by:
        func: last
        duration: 1mo
- type: grid
  column_span: 2
  cards:
