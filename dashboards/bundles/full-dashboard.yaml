        name: Charge Limit
        icon: mdi:battery-sync
        variables:
          metric_color: "#43aa8b"
      - type: custom:button-card
        template: insights_metric_tile
        entity: sensor.ev_time_to_full
        name: Time To Full
        icon: mdi:timer-outline
        variables:
          metric_color: "#43aa8b"
        custom_fields:
          value: |-
            [[[
              const raw = entity?.state;
              if (!raw || raw === "unknown" || raw === "unavailable") return "n/a";

              const target = new Date(raw);
              if (Number.isNaN(target.getTime())) return String(raw).replaceAll("_", " ");

              const diffMinutes = Math.max(0, Math.round((target.getTime() - Date.now()) / 60000));
              const hours = Math.floor(diffMinutes / 60);
              const minutes = diffMinutes % 60;

              if (diffMinutes <= 1) return "now";
              if (hours === 0) return `in ${minutes}m`;
              return minutes > 0 ? `in ${hours}h ${minutes}m` : `in ${hours}h`;
            ]]]
