  max_columns: 3
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: custom:mushroom-title-card
      grid_options:
        columns: full
      title: Battery
      subtitle: Live status, runtime, and charge source
    - type: custom:mushroom-chips-card
      grid_options:
        columns: full
      alignment: justify
      chips:
      - type: template
        entity: sensor.home_battery_percent
        tap_action:
          action: more-info
        icon: mdi:battery
        icon_color: green
        content: '{{ "%.0f" | format(states(''sensor.home_battery_percent'') | float(0))
          }}%'
      - type: template
        entity: sensor.home_battery_power
        tap_action:
          action: more-info
        icon: "{% set p = states('sensor.home_battery_power') | float(0) %} {{ 'mdi:battery-arrow-up'
          if p < -0.1 else 'mdi:battery-arrow-down' if p > 0.1 else 'mdi:battery'
          }}"
        icon_color: "{% set p = states('sensor.home_battery_power') | float(0) %}
          {{ 'green' if p < -0.1 else 'teal' if p > 0.1 else 'grey' }}"
        content: '{{ "%.2f" | format(states(''sensor.home_battery_power'') | float(0))
          }} kW'
      - type: template
        entity: sensor.grid_status
        tap_action:
          action: more-info
        icon: mdi:transmission-tower
        icon_color: blue
        content: "{{ states('sensor.grid_status') }}"
      - type: template
        entity: binary_sensor.storm_watch_active
        tap_action:
          action: more-info
        icon: mdi:weather-lightning-rainy
        icon_color: amber
        content: Storm {{ iif(is_state('binary_sensor.storm_watch_active','on'),'On','Off')
          }}
    - type: grid
      grid_options:
        columns: full
      columns: 4
      square: false
      cards:
      - type: custom:mushroom-template-card
        entity: sensor.battery_runtime_to_backup_reserve_hours
        primary: Backup Reserve
        secondary: |-
          {% set raw = states('sensor.battery_runtime_to_backup_reserve_hours') %} {% set eta = states('sensor.battery_runtime_to_backup_reserve_eta') %} {% if raw not in ['unknown', 'unavailable', 'none', 'None', ''] %}
            {% set mins = (raw | float(0) * 60) | round(0) | int %}
            {{ mins // 60 }}h {{ mins % 60 }}m / {{ as_timestamp(eta) | timestamp_custom('%I:%M %p') }}
          {% elif states('sensor.home_battery_power') | float(0) <= 0.1 %}
            Not discharging
          {% else %}
            Reserve met
          {% endif %}
        icon: mdi:battery-lock
        icon_color: green
        layout: vertical
      - type: custom:mushroom-template-card
        entity: sensor.battery_runtime_to_20_percent_hours
        primary: To 20%
        secondary: |-
          {% set raw = states('sensor.battery_runtime_to_20_percent_hours') %} {% set eta = states('sensor.battery_runtime_to_20_percent_eta') %} {% if raw not in ['unknown', 'unavailable', 'none', 'None', ''] %}
            {% set mins = (raw | float(0) * 60) | round(0) | int %}
            {{ mins // 60 }}h {{ mins % 60 }}m / {{ as_timestamp(eta) | timestamp_custom('%I:%M %p') }}
          {% elif states('sensor.home_battery_power') | float(0) <= 0.1 %}
            Not discharging
          {% else %}
            At or below 20%
          {% endif %}
        icon: mdi:battery-20
        icon_color: amber
        layout: vertical
      - type: custom:mushroom-template-card
        entity: sensor.battery_runtime_to_full_hours
        primary: To 100%
        secondary: |-
          {% set raw = states('sensor.battery_runtime_to_full_hours') %} {% set eta = states('sensor.battery_runtime_to_full_eta') %} {% if raw not in ['unknown', 'unavailable', 'none', 'None', ''] %}
            {% set mins = (raw | float(0) * 60) | round(0) | int %}
            {{ mins // 60 }}h {{ mins % 60 }}m / {{ as_timestamp(eta) | timestamp_custom('%I:%M %p') }}
          {% elif states('sensor.home_battery_power') | float(0) >= -0.1 %}
            Not charging
          {% else %}
            Full
          {% endif %}
        icon: mdi:battery-charging-high
        icon_color: green
        layout: vertical
      - type: custom:mushroom-template-card
        entity: sensor.battery_runtime_to_empty_hours
        primary: To Empty
        secondary: |-
          {% set raw = states('sensor.battery_runtime_to_empty_hours') %} {% set eta = states('sensor.battery_runtime_to_empty_eta') %} {% if raw not in ['unknown', 'unavailable', 'none', 'None', ''] %}
            {% set mins = (raw | float(0) * 60) | round(0) | int %}
            {{ mins // 60 }}h {{ mins % 60 }}m / {{ as_timestamp(eta) | timestamp_custom('%I:%M %p') }}
          {% else %}
            Not discharging
          {% endif %}
        icon: mdi:battery-alert
        icon_color: red
        layout: vertical
    - type: grid
